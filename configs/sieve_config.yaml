# Minimal Dyck Transformer (same architecture as the paper's n13_head1 model) trained on the
# recursive involution sieve sigma_n (src/utils/lemma_sieve.py), which swaps (area, dinv).
# The sieve is total only for n <= 11, so n = 11 (58,786 paths).
# Generate the data first:  python dyck_data.py --n 11 --map sieve --workers 8
model:
  src_vocab_size: 4
  tgt_vocab_size: 4
  d_model: 128
  num_heads: 1
  d_ff: 256
  num_encoder_layers: 1
  num_decoder_layers: 1
  max_len: 128
  dropout: 0
  architecture: 'encoder_decoder'
  is_sinusoidal: false
  seed: 42

training:
  batch_size: 32
  num_epochs: 150
  learning_rate: 0.0001
  weight_decay: 0.0
  cache_dir: 'cache'
  seed: 42

data:
  eval_size: 10000
  n: 11
  target_map: 'sieve'                  # 'zeta' (SageMath, default), 'sieve', or 'kappa'
  data_path: 'data/sieve_data_11.pkl'
  force_regenerate: false
  seed: 42

device:
  use_cuda: true
  use_mps: true                        # use Apple-Silicon GPU when CUDA is unavailable
